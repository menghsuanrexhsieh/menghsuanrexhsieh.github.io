---
layout: default
---

<article class="post">
  <header class="post-head">
    <h1 class="post-head__title">{{ page.title }}</h1>
    <p class="post-head__meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {% if page.tags.size > 0 %}
        <span aria-hidden="true">·</span>
        <span class="tag-list tag-list--sm" style="display:inline-flex;">
          {% for tag in page.tags %}<span class="tag tag--sm">{{ tag }}</span>{% endfor %}
        </span>
      {% endif %}
    </p>
  </header>

  <div class="post-body">
    {{ content }}
  </div>

  <p class="post-back"><a href="{{ '/posts/' | relative_url }}">&larr; All posts</a></p>
</article>

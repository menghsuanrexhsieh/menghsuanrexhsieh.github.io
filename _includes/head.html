<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#faf8ee">

<!-- SEO tags (title, description, Open Graph, Twitter cards) -->
{% seo %}

<!-- Set the theme before paint to avoid a flash of the wrong colors -->
<script>
  (function () {
    var saved = localStorage.getItem('theme');
    var system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', saved || system);
  })();
</script>

<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">

<!-- Fonts: Roboto for text, JetBrains Mono for code -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=JetBrains+Mono:wght@400..600&display=swap">

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">

<!-- MathJax Support -->
<script>
  window.MathJax = {
    loader: { load: {{ site.data.mathjax_config.load | jsonify }} },
    tex: {
      packages: {{ site.data.mathjax_config.packages | jsonify }},
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      tags: 'ams',
      macros: {{ site.data.mathjax_macros | jsonify }}
    }
  };
</script>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@{{ site.data.mathjax_config.version }}/es5/tex-mml-chtml.js">
</script>

<!-- Synopsis / Abstract panels are collapsed via the `hidden` attribute and
     opened by main.js. With JavaScript off, show them all rather than
     hiding the text behind buttons that cannot work. -->
<noscript><style>.synopsis__panel[hidden] { display: block; }</style></noscript>

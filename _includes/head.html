<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#faf8ee">

<!-- SEO tags (title, description, Open Graph, Twitter cards) -->
{% seo %}

<!-- Set the theme before paint to avoid a flash of the wrong colors -->
<script>
  (function () {
    var saved = localStorage.getItem('theme');
    var system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', saved || system);
  })();
</script>

<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

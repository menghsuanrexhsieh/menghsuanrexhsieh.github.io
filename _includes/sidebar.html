{% assign u = page.url %}
<aside class="sidebar">
  <!-- Portrait: replace assets/img/portrait.svg with your photo
       (e.g. assets/img/portrait.jpg) and update the src below. -->
  <a class="sidebar__portrait" href="{{ '/' | relative_url }}" aria-label="Home — {{ site.author }}">
    <img src="{{ '/assets/img/portrait.svg' | relative_url }}"
         alt="Portrait of {{ site.author }}" width="128" height="128">
  </a>

  <p class="sidebar__name">{{ site.author }}</p>
  <p class="sidebar__role">{{ site.tagline }}</p>

  <nav class="sidebar__nav" aria-label="Primary">
    <a href="{{ '/research/' | relative_url }}"{% if u contains '/research' %} class="is-active" aria-current="page"{% endif %}>Research</a>
    <a href="{{ '/teaching/' | relative_url }}"{% if u contains '/teaching' %} class="is-active" aria-current="page"{% endif %}>Teaching</a>
    <a href="{{ '/posts/' | relative_url }}"{% if u contains '/posts' or page.layout == 'post' %} class="is-active" aria-current="page"{% endif %}>Posts</a>
  </nav>

  <div class="sidebar__toggle">
    <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle theme">
      <svg class="theme-toggle__sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
      </svg>
      <svg class="theme-toggle__moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </div>
</aside>
